apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-postgres-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-postgres
  template:
    metadata:
      labels:
        app: notification-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: notif_user
            - name: POSTGRES_PASSWORD
              value: notif_pass
            - name: POSTGRES_DB
              value: notification_db
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notification-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: notification-postgres
spec:
  selector:
    app: notification-postgres
  ports:
    - port: 5432
      targetPort: 5432
