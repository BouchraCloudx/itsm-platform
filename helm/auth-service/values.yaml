replicaCount: 2

image:
  repository: itsm-platform-auth-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 3001

env:
  PORT: "3001"
  DATABASE_URL: "postgresql://auth_user:auth_pass@auth-postgres:5432/auth_db?schema=public"
  JWT_EXPIRES_IN: "1h"

jwtSecretName: jwt-secret
jwtSecretKey: JWT_SECRET

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

healthCheck:
  path: /health
  port: 3001
