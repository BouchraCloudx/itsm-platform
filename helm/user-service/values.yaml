replicaCount: 2

image:
  repository: itsm-platform-user-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 3003

env:
  PORT: "3003"
  DATABASE_URL: "postgresql://user_user:user_pass@user-postgres:5432/user_db?schema=public"

jwtSecretName: jwt-secret
jwtSecretKey: JWT_SECRET

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

healthCheck:
  path: /health
  port: 3003
